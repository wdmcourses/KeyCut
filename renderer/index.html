<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' file: blob:; img-src 'self' file: data: blob:;" />
  <title>KeyCut</title>
  <link rel="icon" href="../assets/icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="content">
    <section id="player">
      <div id="video-wrap">
        <video id="video" preload="auto"></video>
        <audio id="scrub-audio" preload="auto"></audio>
        <div id="video-placeholder">
          <div class="placeholder-icon">&#9654;</div>
          <div class="placeholder-text">Open a video to start editing</div>
          <button id="btn-open2" class="toolbar-btn primary">Open File</button>
        </div>
      </div>
      <div id="player-controls">
        <div id="time-display"><span id="time-current">00:00:00.000</span><span class="sep">/</span><span id="time-total">00:00:00.000</span><span class="sep">/</span><span id="time-pct"></span></div>
        <div class="spacer"></div>
        <div class="transport">
          <button id="btn-start" class="ctrl-btn" title="To start of project">
            <svg viewBox="0 0 24 24" width="18" height="18"><line x1="4" y1="6" x2="4" y2="18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M18 6 L12 12 L18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 6 L7 12 L13 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-prevblock" class="ctrl-btn" title="Previous block">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M16 6 L10 12 L16 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 6 L5 12 L11 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-prevkf" class="ctrl-btn" title="Previous keyframe (S / &larr;)">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M14.5 6 L8.5 12 L14.5 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-play" class="ctrl-btn play-btn" title="Play / Pause (Space)">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5.5 L18.5 12 L8 18.5 Z" fill="currentColor"/></svg>
          </button>
          <button id="btn-nextkf" class="ctrl-btn" title="Next keyframe (F / &rarr;)">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9.5 6 L15.5 12 L9.5 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-nextblock" class="ctrl-btn" title="Next block">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 6 L14 12 L8 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 6 L19 12 L13 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-end" class="ctrl-btn" title="To end of project">
            <svg viewBox="0 0 24 24" width="18" height="18"><line x1="20" y1="6" x2="20" y2="18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M6 6 L12 12 L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 6 L17 12 L11 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="action-buttons">
          <button id="btn-open" class="toolbar-btn compact" title="Open file (Ctrl+O)">Open</button>
          <button id="btn-save" class="toolbar-btn compact" title="Save project (Ctrl+S)">Save</button>
          <button id="btn-export" class="toolbar-btn compact primary" title="Export lossless (Ctrl+E)">Export</button>
        </div>
      </div>
    </section>

    <section id="timeline-section">
      <div id="timeline-wrap">
        <canvas id="timeline"></canvas>
        <div id="timeline-scrollbar">
          <div id="scrollbar-thumb">
            <div id="scrollbar-handle-l"></div>
            <div id="scrollbar-grip"></div>
            <div id="scrollbar-handle-r"></div>
          </div>
        </div>
        <div id="zoom-row">
          <button id="btn-zoom-out" class="mini-btn" title="Zoom out">&minus;</button>
          <input id="zoom-range" type="range" min="0" max="100" value="50" />
          <button id="btn-zoom-in" class="mini-btn" title="Zoom in">+</button>
          <div id="stats"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="statusbar">
    <div id="status-text">Ready</div>
    <div id="progress-wrap" class="hidden">
      <div id="progress-bar"></div>
    </div>
    <div id="spinner" class="hidden"></div>
    <div id="statusbar-hints">
      <span class="hint"><kbd>C</kbd> Cut</span>
      <span class="hint"><kbd>X</kbd> Del · <kbd>R</kbd> Restore</span>
      <span class="hint"><kbd>V</kbd> Merge</span>
      <span class="hint"><kbd>S</kbd><kbd>F</kbd> Frame</span>
      <span class="hint"><kbd>Ctrl+E</kbd> Export</span>
    </div>
  </footer>

  <div id="export-modal" class="hidden">
    <div id="export-modal-card">
      <div id="export-modal-title">Export</div>
      <div id="export-modal-bar"><div id="export-modal-fill"></div></div>
      <div id="export-modal-status">Preparing…</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
